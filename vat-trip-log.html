<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>V.A. Transportation — Trip Log</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0a1628;--navy2:#0f1e35;--navy3:#162844;
  --blue:#1a3a6e;--blue2:#4a8fc9;--blue3:rgba(74,143,201,.15);
  --red:#8b1a1a;--red2:#cc2200;
  --text:#e8e6e0;--muted:#6a7f99;--border:rgba(255,255,255,.1);
  --green:#4caf70;--gold:#c9a84c;
}
html,body{min-height:100vh;background:var(--navy);color:var(--text);font-family:'DM Sans',sans-serif;font-size:16px}

.hdr{background:var(--navy2);border-bottom:1px solid var(--border);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.hdr-left{display:flex;align-items:center;gap:12px}
.hdr-mark{width:36px;height:36px;border-radius:8px;background:var(--blue);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--blue2);font-family:'DM Mono',monospace}
.hdr-title{font-size:15px;font-weight:600;color:#fff}
.hdr-sub{font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;font-family:'DM Mono',monospace;margin-top:2px}

.main{padding:20px;max-width:560px;margin:0 auto;padding-bottom:100px}

.section{margin-bottom:24px}
.section-title{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--blue2);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.section-title::after{content:'';flex:1;height:1px;background:rgba(74,143,201,.2)}

.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-family:'DM Mono',monospace}
.field input,.field select,.field textarea{width:100%;padding:13px 16px;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:8px;color:#fff;font-family:'DM Sans',sans-serif;font-size:16px;outline:none;transition:border .2s;-webkit-appearance:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue2);background:rgba(74,143,201,.08)}
.field input::placeholder,.field textarea::placeholder{color:rgba(106,127,153,.6)}
.field select option{background:var(--navy2)}
.field textarea{resize:none;min-height:80px}

.row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

.toggle-row{display:flex;gap:10px;margin-bottom:14px}
.toggle-btn{flex:1;padding:12px;border:1px solid var(--border);border-radius:8px;background:rgba(255,255,255,.04);color:var(--muted);font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;transition:all .2s;text-align:center}
.toggle-btn.active{background:var(--blue3);border-color:var(--blue2);color:var(--blue2)}
.toggle-label{font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;font-family:'DM Mono',monospace}

.leg-card{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:12px}
.leg-title{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--blue2);margin-bottom:14px;font-family:'DM Mono',monospace}

.submit-bar{position:fixed;bottom:0;left:0;right:0;padding:16px 20px;background:var(--navy2);border-top:1px solid var(--border);z-index:50}
.submit-btn{width:100%;padding:16px;background:linear-gradient(135deg,var(--blue),#0d2a5a);border:1px solid var(--blue2);border-radius:10px;color:#fff;font-family:'DM Sans',sans-serif;font-size:16px;font-weight:600;cursor:pointer;transition:opacity .2s;letter-spacing:.04em}
.submit-btn:disabled{opacity:.5;cursor:not-allowed}
.submit-btn.success{background:linear-gradient(135deg,#1a5c2a,#0d3a1a);border-color:var(--green)}

.result{margin:16px 0;padding:16px;border-radius:10px;font-size:14px;display:none;line-height:1.6;text-align:center}
.result.success{background:rgba(76,175,112,.1);border:1px solid rgba(76,175,112,.3);color:var(--green)}
.result.error{background:rgba(204,34,0,.1);border:1px solid rgba(204,34,0,.3);color:#ff6b4a}
.trip-id{font-family:'DM Mono',monospace;font-size:20px;font-weight:500;margin-bottom:4px}

.divider{height:1px;background:var(--border);margin:8px 0 20px}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-left">
    <div class="hdr-mark">VA</div>
    <div>
      <div class="hdr-title">V.A. Transportation</div>
      <div class="hdr-sub">Driver Trip Log</div>
    </div>
  </div>
  <div style="font-family:'DM Mono',monospace;font-size:11px;color:var(--muted)" id="todayDate"></div>
</div>

<div class="main">

  <div class="section">
    <div class="section-title">Trip Info</div>
    <div class="row-2">
      <div class="field">
        <label>Trip Date</label>
        <input type="date" id="trip_date">
      </div>
      <div class="field">
        <label>Trip #</label>
        <input type="text" id="trip_number" placeholder="001">
      </div>
    </div>
    <div class="row-2">
      <div class="field">
        <label>Driver Name</label>
        <input type="text" id="driver" placeholder="Full name">
      </div>
      <div class="field">
        <label>Vehicle #</label>
        <input type="text" id="vehicle_number" placeholder="VAT-01">
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Client Info</div>
    <div class="field">
      <label>Client Name *</label>
      <input type="text" id="client_name" placeholder="Full name">
    </div>
    <div class="field">
      <label>Client Phone</label>
      <input type="tel" id="client_phone" placeholder="713-555-0100">
    </div>
    <div class="field">
      <label>Appointment Time</label>
      <input type="time" id="appointment_time">
    </div>
    <div class="field">
      <label>Doctor / Facility</label>
      <input type="text" id="doctor_facility" placeholder="Facility name">
    </div>
  </div>

  <div class="section">
    <div class="section-title">Trip Type</div>
    <div class="toggle-label">Trip Type</div>
    <div class="toggle-row">
      <button class="toggle-btn active" onclick="setToggle('trip_type','One-Way',this)">One-Way</button>
      <button class="toggle-btn" onclick="setToggle('trip_type','Round-Trip',this)">Round-Trip</button>
      <button class="toggle-btn" onclick="setToggle('trip_type','Companion',this)">Companion</button>
    </div>
    <div class="toggle-label">Wheelchair</div>
    <div class="toggle-row">
      <button class="toggle-btn active" onclick="setToggle('wheelchair','N',this)">No</button>
      <button class="toggle-btn" onclick="setToggle('wheelchair','Y',this)">Yes</button>
    </div>
    <div class="toggle-label">ADA Assist</div>
    <div class="toggle-row">
      <button class="toggle-btn active" onclick="setToggle('ada_assist','N',this)">No</button>
      <button class="toggle-btn" onclick="setToggle('ada_assist','Y',this)">Yes</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Legs</div>

    <div class="leg-card">
      <div class="leg-title">Leg 1 — A to B</div>
      <div class="row-2">
        <div class="field">
          <label>P/U Time</label>
          <input type="time" id="leg1_pu_time">
        </div>
        <div class="field">
          <label>Arrive Time</label>
          <input type="time" id="leg1_arrive_time">
        </div>
      </div>
      <div class="field">
        <label>P/U Address</label>
        <input type="text" id="leg1_pu_address" placeholder="Street address">
      </div>
      <div class="row-2">
        <div class="field">
          <label>Odom Start</label>
          <input type="number" id="leg1_odom_start" placeholder="00000">
        </div>
        <div class="field">
          <label>Client Condition</label>
          <select id="leg1_client_condition">
            <option value="">— Select —</option>
            <option>Good</option>
            <option>Fair</option>
            <option>Needs Assistance</option>
            <option>Medical Alert</option>
          </select>
        </div>
      </div>
    </div>

    <div class="leg-card">
      <div class="leg-title">Leg 2 — B to C (if applicable)</div>
      <div class="row-2">
        <div class="field">
          <label>P/U Time</label>
          <input type="time" id="leg2_pu_time">
        </div>
        <div class="field">
          <label>Arrive Time</label>
          <input type="time" id="leg2_arrive_time">
        </div>
      </div>
      <div class="field">
        <label>P/U Address</label>
        <input type="text" id="leg2_pu_address" placeholder="Street address">
      </div>
      <div class="row-2">
        <div class="field">
          <label>Odom Start</label>
          <input type="number" id="leg2_odom_start" placeholder="00000">
        </div>
        <div class="field">
          <label>Client Condition</label>
          <select id="leg2_client_condition">
            <option value="">— Select —</option>
            <option>Good</option>
            <option>Fair</option>
            <option>Needs Assistance</option>
            <option>Medical Alert</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Drop-Off</div>
    <div class="field">
      <label>Drop Address</label>
      <input type="text" id="drop_address" placeholder="Street address">
    </div>
    <div class="row-2">
      <div class="field">
        <label>Drop Time</label>
        <input type="time" id="drop_time">
      </div>
      <div class="field">
        <label>Odom Stop</label>
        <input type="number" id="odom_stop" placeholder="00000">
      </div>
    </div>
    <div class="field">
      <label>Final Client Condition</label>
      <select id="final_client_condition">
        <option value="">— Select —</option>
        <option>Good</option>
        <option>Fair</option>
        <option>Needs Assistance</option>
        <option>Medical Alert</option>
      </select>
    </div>
    <div class="field">
      <label>Notes</label>
      <textarea id="notes" placeholder="Any incidents, delays, or additional notes..."></textarea>
    </div>
  </div>

  <div id="result" class="result"></div>

</div>

<div class="submit-bar">
  <button class="submit-btn" id="submitBtn" onclick="submitTrip()">Submit Trip Log →</button>
</div>

<script>
var ENDPOINT = 'https://script.google.com/macros/s/AKfycbxAYbA-5_QoHK_HJ4gINI99-s0zfxQhe4gjM5Bc3c3ltRG6LAxHVl04TXT3jLCoHac8/exec';
var toggleValues = { trip_type: 'One-Way', wheelchair: 'N', ada_assist: 'N' };

function setToggle(key, val, btn) {
  toggleValues[key] = val;
  var group = btn.parentElement;
  group.querySelectorAll('.toggle-btn').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
}

function setDate() {
  var now = new Date();
  document.getElementById('todayDate').textContent = now.toLocaleDateString('en-US',{month:'short',day:'numeric'}).toUpperCase();
  var y = now.getFullYear();
  var m = String(now.getMonth()+1).padStart(2,'0');
  var d = String(now.getDate()).padStart(2,'0');
  document.getElementById('trip_date').value = y+'-'+m+'-'+d;
}

async function submitTrip() {
  var clientName = document.getElementById('client_name').value.trim();
  if (!clientName) {
    showResult('error', 'Please enter the client name.');
    return;
  }

  var btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'Submitting...';

  var tripDate = document.getElementById('trip_date').value;
  var formatted = tripDate ? new Date(tripDate + 'T12:00:00').toLocaleDateString() : new Date().toLocaleDateString();

  var params = new URLSearchParams({
    action: 'vat',
    trip_date: formatted,
    trip_number: document.getElementById('trip_number').value,
    driver: document.getElementById('driver').value,
    vehicle_number: document.getElementById('vehicle_number').value,
    client_name: clientName,
    client_phone: document.getElementById('client_phone').value,
    trip_type: toggleValues.trip_type,
    wheelchair: toggleValues.wheelchair,
    ada_assist: toggleValues.ada_assist,
    appointment_time: document.getElementById('appointment_time').value,
    doctor_facility: document.getElementById('doctor_facility').value,
    leg1_pu_time: document.getElementById('leg1_pu_time').value,
    leg1_pu_address: document.getElementById('leg1_pu_address').value,
    leg1_arrive_time: document.getElementById('leg1_arrive_time').value,
    leg1_odom_start: document.getElementById('leg1_odom_start').value,
    leg1_client_condition: document.getElementById('leg1_client_condition').value,
    leg2_pu_time: document.getElementById('leg2_pu_time').value,
    leg2_pu_address: document.getElementById('leg2_pu_address').value,
    leg2_arrive_time: document.getElementById('leg2_arrive_time').value,
    leg2_odom_start: document.getElementById('leg2_odom_start').value,
    leg2_client_condition: document.getElementById('leg2_client_condition').value,
    drop_address: document.getElementById('drop_address').value,
    drop_time: document.getElementById('drop_time').value,
    odom_stop: document.getElementById('odom_stop').value,
    final_client_condition: document.getElementById('final_client_condition').value,
    invoice_sent: 'No',
    notes: document.getElementById('notes').value
  });

  try {
    var resp = await fetch(ENDPOINT + '?' + params.toString());
    var data = await resp.json();
    if (data.success) {
      showResult('success', '<div class="trip-id">' + data.trip_id + '</div>Trip logged successfully. Have a safe ride.');
      btn.textContent = '✓ Trip Logged';
      btn.classList.add('success');
    } else {
      throw new Error(data.error || 'Unknown error');
    }
  } catch(e) {
    showResult('error', 'Error: ' + e.message);
    btn.disabled = false;
    btn.textContent = 'Submit Trip Log →';
  }
}

function showResult(type, msg) {
  var el = document.getElementById('result');
  el.className = 'result ' + type;
  el.innerHTML = msg;
  el.style.display = 'block';
  el.scrollIntoView({behavior:'smooth', block:'nearest'});
}

setDate();
</script>
</body>
</html>
